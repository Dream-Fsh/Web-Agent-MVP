name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/no-real-model.cjs
      - run: npm run build
      - run: npm run verify:extension -w @web-agent/extension
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/no-real-model.cjs
      - run: npm run verify
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/no-real-model.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-e2e-evidence
          path: |
            test-results/
            !test-results/**/profile/**
            !test-results/**/browser-profile/**
            !test-results/**/record-profile/**
            !test-results/**/recordings/**
            !test-results/**/.key
          retention-days: 7
